name: Build missing SDL3_mixer desktop archives

run-name: Build missing SDL3_mixer desktop archives

on:
  workflow_dispatch:
  push:
    branches:
      - spec-desktop-platform-portability-07
    paths:
      - .github/workflows/build-portability.yml
      - Native/build-sdl3-mixer.sh
      - Boundary/SDL3_mixer-3.2.4-silex.2.patch

permissions:
  contents: read

concurrency:
  group: gfx-audio-build-portability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-x64
            runner: macos-15-intel
            archive: SDL3_mixer-3.2.4-macos-x64.a
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            archive: SDL3_mixer-3.2.4-linux-arm64.a

    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40

    steps:
      - name: Check out GFX.Audio
        uses: actions/checkout@v6
        with:
          path: GFX.Audio

      - name: Select the recorded Xcode toolchain
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version

      - name: Download and verify upstream sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sources"
          curl -fL https://github.com/libsdl-org/SDL/releases/download/release-3.4.10/SDL3-3.4.10.tar.gz -o "$RUNNER_TEMP/SDL3.tar.gz"
          curl -fL https://github.com/libsdl-org/SDL_mixer/releases/download/release-3.2.4/SDL3_mixer-3.2.4.tar.gz -o "$RUNNER_TEMP/SDL3_mixer.tar.gz"
          if command -v sha256sum >/dev/null 2>&1; then
            echo "12b34280415ec8418c864408b93d008a20a6530687ee613d60bfbd20411f2785  $RUNNER_TEMP/SDL3.tar.gz" | sha256sum -c -
            echo "182a07c745375e113dc740d43964ff21b0be29f29f59876c4dbc4db3d32f6901  $RUNNER_TEMP/SDL3_mixer.tar.gz" | sha256sum -c -
          else
            echo "12b34280415ec8418c864408b93d008a20a6530687ee613d60bfbd20411f2785  $RUNNER_TEMP/SDL3.tar.gz" | shasum -a 256 -c -
            echo "182a07c745375e113dc740d43964ff21b0be29f29f59876c4dbc4db3d32f6901  $RUNNER_TEMP/SDL3_mixer.tar.gz" | shasum -a 256 -c -
          fi
          tar -xzf "$RUNNER_TEMP/SDL3.tar.gz" -C "$RUNNER_TEMP/sources"
          tar -xzf "$RUNNER_TEMP/SDL3_mixer.tar.gz" -C "$RUNNER_TEMP/sources"

      - name: Build twice on macOS X64
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/output-a" "$RUNNER_TEMP/output-b"
          env RUNNER_TEMP="$RUNNER_TEMP/rebuild-a" GFX.Audio/Native/build-sdl3-mixer.sh \
            "$RUNNER_TEMP/sources/SDL3-3.4.10" \
            "$RUNNER_TEMP/sources/SDL3_mixer-3.2.4" \
            "${{ matrix.target }}" "$RUNNER_TEMP/output-a"
          env RUNNER_TEMP="$RUNNER_TEMP/rebuild-b" GFX.Audio/Native/build-sdl3-mixer.sh \
            "$RUNNER_TEMP/sources/SDL3-3.4.10" \
            "$RUNNER_TEMP/sources/SDL3_mixer-3.2.4" \
            "${{ matrix.target }}" "$RUNNER_TEMP/output-b"
          cmp "$RUNNER_TEMP/output-a/${{ matrix.archive }}" "$RUNNER_TEMP/output-b/${{ matrix.archive }}"

      - name: Build twice in the Linux compatibility baseline
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --platform linux/arm64 \
            -e RUNNER_TEMP=/runner-temp/rebuild-a \
            -v "$GITHUB_WORKSPACE:/workspace:ro" \
            -v "$RUNNER_TEMP:/runner-temp" \
            ubuntu:22.04@sha256:2edbbc5dc405e9612ba3584ce95480277e3eb374407b5505fe26f17df77c7dbc bash -lc '
              set -euo pipefail
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -y
              apt-get install -y build-essential cmake file ninja-build patch
              mkdir -p /runner-temp/output-a
              /workspace/GFX.Audio/Native/build-sdl3-mixer.sh \
                /runner-temp/sources/SDL3-3.4.10 \
                /runner-temp/sources/SDL3_mixer-3.2.4 \
                linux-arm64 /runner-temp/output-a
            '
          docker run --rm --platform linux/arm64 \
            -e RUNNER_TEMP=/runner-temp/rebuild-b \
            -v "$GITHUB_WORKSPACE:/workspace:ro" \
            -v "$RUNNER_TEMP:/runner-temp" \
            ubuntu:22.04@sha256:2edbbc5dc405e9612ba3584ce95480277e3eb374407b5505fe26f17df77c7dbc bash -lc '
              set -euo pipefail
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -y
              apt-get install -y build-essential cmake file ninja-build patch
              mkdir -p /runner-temp/output-b
              /workspace/GFX.Audio/Native/build-sdl3-mixer.sh \
                /runner-temp/sources/SDL3-3.4.10 \
                /runner-temp/sources/SDL3_mixer-3.2.4 \
                linux-arm64 /runner-temp/output-b
            '
          cmp "$RUNNER_TEMP/output-a/${{ matrix.archive }}" "$RUNNER_TEMP/output-b/${{ matrix.archive }}"

      - name: Record candidate checksum
        shell: bash
        run: |
          set -euo pipefail
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$RUNNER_TEMP/output-a/${{ matrix.archive }}"
          else
            shasum -a 256 "$RUNNER_TEMP/output-a/${{ matrix.archive }}"
          fi

      - name: Preserve candidate archive
        uses: actions/upload-artifact@v4
        with:
          name: gfx-audio-${{ matrix.target }}
          path: ${{ runner.temp }}/output-a/${{ matrix.archive }}
          retention-days: 7
          if-no-files-found: error
