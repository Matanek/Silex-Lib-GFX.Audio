name: Build portable SDL3_mixer streaming archives

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gfx-audio-provider-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        target: [macos-arm64, macos-x64, linux-x64, linux-arm64, windows-x64, windows-arm64]
    name: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Download the recorded tools and upstream sources
        shell: bash
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            arm64) zig_arch=aarch64; zig_sha=b23d70deaa879b5c2d486ed3316f7eaa53e84acf6fc9cc747de152450d401489 ;;
            x86_64) zig_arch=x86_64; zig_sha=0387557ed1877bc6a2e1802c8391953baddba76081876301c522f52977b52ba7 ;;
            *) exit 1 ;;
          esac
          curl -fL --retry 5 "https://ziglang.org/download/0.16.0/zig-$zig_arch-macos-0.16.0.tar.xz" -o "$RUNNER_TEMP/zig.tar.xz"
          echo "$zig_sha  $RUNNER_TEMP/zig.tar.xz" | shasum -a 256 -c -
          tar -xf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP"
          echo "ZIG=$RUNNER_TEMP/zig-$zig_arch-macos-0.16.0/zig" >> "$GITHUB_ENV"
          curl -fL --retry 5 https://github.com/libsdl-org/SDL/releases/download/release-3.4.10/SDL3-3.4.10.tar.gz -o "$RUNNER_TEMP/SDL3.tar.gz"
          curl -fL --retry 5 https://github.com/libsdl-org/SDL_mixer/releases/download/release-3.2.4/SDL3_mixer-3.2.4.tar.gz -o "$RUNNER_TEMP/SDL3_mixer.tar.gz"
      - name: Rebuild twice and compare with the manifest
        shell: bash
        env:
          AUDIO_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          case "$AUDIO_TARGET" in
            windows-*) archive=SDL3_mixer.lib ;;
            *) archive=libSDL3_mixer.a ;;
          esac
          python3 Native/build-stream-provider.py "$RUNNER_TEMP/SDL3.tar.gz" "$RUNNER_TEMP/SDL3_mixer.tar.gz" "$AUDIO_TARGET" "$RUNNER_TEMP/output-a/$archive"
          python3 Native/build-stream-provider.py "$RUNNER_TEMP/SDL3.tar.gz" "$RUNNER_TEMP/SDL3_mixer.tar.gz" "$AUDIO_TARGET" "$RUNNER_TEMP/output-b/$archive"
          cmp "$RUNNER_TEMP/output-a/$archive" "$RUNNER_TEMP/output-b/$archive"
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          target = os.environ['AUDIO_TARGET']
          artifact = json.loads(Path('Package.json').read_text())['artifacts'][target]['SDL3_mixer']
          archive = Path(os.environ['RUNNER_TEMP']) / 'output-a' / Path(artifact['path']).name
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == artifact['sha256']
          PY
          nm -g "$RUNNER_TEMP/output-a/$archive" > "$RUNNER_TEMP/symbols.txt"
          grep -q Silex_MIX_CloseTrackStream "$RUNNER_TEMP/symbols.txt"
          grep -q Silex_MIX_TrackDrained "$RUNNER_TEMP/symbols.txt"
          grep -q Silex_MIX_CaptureCreate "$RUNNER_TEMP/symbols.txt"
          grep -q Silex_MIX_CaptureRead "$RUNNER_TEMP/symbols.txt"
          grep -q Silex_MIX_CaptureStop "$RUNNER_TEMP/symbols.txt"
      - uses: actions/upload-artifact@v7
        with:
          name: SDL3_mixer-3.2.4-silex.7-${{ matrix.target }}
          path: ${{ runner.temp }}/output-a/*
          if-no-files-found: error
